<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../src/style.css" rel="stylesheet">
    <title>Fi-Track :: Reset Password</title>
</head>

<body class="w-full h-screen overflow-hidden  dark:bg-black/95 dark:text-white/80 text-black/70">
    <div class="flex items-center justify-center w-full h-full">
        <div class="w-full space-y-6 p-4 max-w-md border border-black/20 dark:border-white/20 rounded-lg shadow-lg">
            <a href="../">
                <h1 class=" text-center font-semibold text-2xl lg:text-4xl text-black/90 dark:text-white/80">
                    Fi-Track
                </h1>
            </a>
            <div id="message-container" class="hidden p-3 rounded-md bg-gray-100 dark:bg-gray-800 text-sm text-center mb-4"></div>
            <p class="text-center text-sm pt-4">
                Looks like you forgot your password.
                <br>
                Enter your email and we'll send you a password reset link.
            </p>
            <form id="reset-request-form" class="space-y-4">
                <div class="flex flex-col gap-2">
                    <label for="email" class="font-semibold text-sm">Enter Your Email</label>
                    <input type="email" name="email" id="email" minlength="3" maxlength="64" required
                        class="p-2 w-full border border-black/30 dark:border-white/20 rounded-sm shadow-sm">
                </div>
                <button type="submit" class="primary-button w-full">Send me the email</button>
                <a href="/" class="secondary-button w-full inline-block text-center">Back to login</a>
            </form>
        </div>

    </div>

    <button class="rounded-full w-12 h-12 fixed bottom-5 right-5 p-2 border border-black/70 dark:border-white/20"
        id="darkModeButton">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="w-full h-full">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M4.098 19.902a3.75 3.75 0 0 0 5.304 0l6.401-6.402M6.75 21A3.75 3.75 0 0 1 3 17.25V4.125C3 3.504 3.504 3 4.125 3h5.25c.621 0 1.125.504 1.125 1.125v4.072M6.75 21a3.75 3.75 0 0 0 3.75-3.75V8.197M6.75 21h13.125c.621 0 1.125-.504 1.125-1.125v-5.25c0-.621-.504-1.125-1.125-1.125h-4.072M10.5 8.197l2.88-2.88c.438-.439 1.15-.439 1.59 0l3.712 3.713c.44.44.44 1.152 0 1.59l-2.879 2.88M6.75 17.25h.008v.008H6.75v-.008Z" />
        </svg>
    </button>
    <script type="module" src="../src/scripts/auth/reset-request.js"></script>
    <script type="module" src="../src/scripts/theme/theme.js"></script>

</body>

</html>
